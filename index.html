<style>
  :root{
    --coral:#F0554E; --coral-dark:#D23E38; --paper:#fbfaf9;
    --ink:#3a3a3a; --muted:#a49b93; --line:#efe8e2; --line2:#e8e2dc;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink)}
  img{display:block;max-width:100%}
  button{font-family:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}

  header{background:#fff;position:sticky;top:0;z-index:20}
  .head-in{max-width:1080px;margin:0 auto;padding:14px 18px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:flex-end;gap:10px;background:none;border:none;cursor:pointer;padding:0}
  .brand img{height:46px}
  .brand .sub{font-size:12px;color:var(--muted);padding-bottom:6px;font-style:italic}
  .rule{height:3px;background:var(--coral)}
  .nav-ghost{border:none;background:none;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:5px}
  .nav-btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;color:#514840}

  main{max-width:1080px;margin:0 auto;padding:22px 18px 40px}

  .featured{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:26px;cursor:pointer}
  .featured .fimg{min-height:280px;background:#f0ebe7;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .featured .fimg img{width:100%;height:100%;object-fit:cover}
  .featured .fbody{padding:30px 32px;display:flex;flex-direction:column;justify-content:center}
  .ftag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--coral);margin-bottom:10px}
  .ftitle{font-size:28px;margin:0 0 4px;font-weight:600;line-height:1.15}
  .fref{font-size:13px;color:var(--muted);margin:0 0 12px}
  .fprice{font-size:26px;font-weight:700;margin:0 0 18px;color:var(--coral)}
  .fcta{font-size:14px;color:#fff;font-weight:600;background:var(--coral);align-self:flex-start;padding:9px 20px;border-radius:24px}

  .cupom-cta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(100deg,#fff5f4,#fdeceb);border:1px solid #f6d4d1;border-radius:16px;padding:16px 22px;margin-bottom:22px}
  .cupom-title{font-size:16px;font-weight:700;margin:0 0 2px;color:var(--coral-dark)}
  .cupom-sub{font-size:13px;color:#8a6f6c;margin:0}
  .cupom-btn{background:var(--coral);color:#fff;border:none;border-radius:24px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .cupom-btn:hover{background:var(--coral-dark)}
  .ok-box{text-align:center;padding:10px 4px}
  .ok-emoji{font-size:44px;margin-bottom:6px}
  .controls{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
  .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:24px;padding:0 16px}
  .search input{flex:1;border:none;outline:none;padding:12px 0;font-size:15px;background:none;color:var(--ink)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line2);background:#fff;border-radius:22px;padding:7px 16px;font-size:13px;cursor:pointer;color:#6b625a}
  .chip.on{background:var(--coral);color:#fff;border-color:var(--coral)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;padding:0;text-align:left}
  .cimg{position:relative;aspect-ratio:3/4;background:#f0ebe7;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .cimg img{width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;top:10px;left:10px;background:var(--coral);color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:4px}
  .badge-out{position:absolute;top:10px;right:10px;background:rgba(74,74,74,.85);color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px}
  .cbody{padding:12px 14px 15px}
  .cname{font-size:14px;font-weight:500;margin:0 0 2px;line-height:1.3}
  .cref{font-size:12px;color:var(--muted);margin:0 0 7px}
  .cprice{font-size:17px;font-weight:700;margin:0;color:var(--coral)}

  .overlay{position:fixed;inset:0;background:rgba(50,44,40,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:780px;max-height:90vh;overflow:auto;position:relative}
  .modal.sm{max-width:620px}
  .mclose{position:absolute;top:12px;right:12px;background:#fff;border:1px solid var(--line2);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;color:#6b625a;font-size:18px}
  .mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .mimgcol{padding:16px}
  .mimg{position:relative;aspect-ratio:3/4;background:#f0ebe7;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .mimg img{width:100%;height:100%;object-fit:cover}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.92);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
  .thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .thumb{width:52px;height:52px;border-radius:8px;border:2px solid var(--line2);overflow:hidden;cursor:pointer;padding:0;background:#f0ebe7}
  .thumb.on{border-color:var(--coral)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .minfo{padding:24px 26px 26px}
  .mcat{font-size:12px;color:var(--coral);font-weight:600}
  .mtitle{font-size:24px;margin:6px 0 2px;font-weight:600;line-height:1.2}
  .mref{font-size:13px;color:var(--muted);margin:0 0 12px}
  .mprice{font-size:27px;font-weight:700;margin:0 0 14px;color:var(--coral)}
  .mdesc{font-size:14px;color:#6b625a;line-height:1.6;margin:0}
  .mlabel{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 7px}
  .tags{display:flex;gap:7px;flex-wrap:wrap}
  .tag{border:1px solid var(--line2);border-radius:7px;padding:6px 12px;font-size:13px;color:#514840;background:var(--paper)}
  .wa{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;font-weight:600;font-size:15px;padding:13px;border-radius:12px;text-decoration:none;border:none;cursor:pointer}
  .out{margin-top:20px;background:#fdecea;color:var(--coral-dark);padding:12px 14px;border-radius:10px;font-size:14px;text-align:center}
  .mhint{font-size:12px;color:#b0aaa4;margin:10px 0 0;text-align:center;line-height:1.5}

  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty .t{font-size:17px;font-weight:600;color:#6b625a;margin:6px 0 0}

  .login{background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 26px;text-align:center;margin:30px auto 0;max-width:400px;display:flex;flex-direction:column;align-items:center}
  .login img{height:54px;margin-bottom:14px}
  .input{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:15px;outline:none;background:#fff;color:var(--ink);font-family:inherit}
  textarea.input{height:70px;padding-top:8px;resize:vertical}
  .pbtn{width:100%;background:var(--coral);color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
  .pbtn.auto{width:auto;padding:10px 20px}
  .tbtn{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;margin-top:10px;padding:6px}
  .err{color:var(--coral-dark);font-size:13px;margin:8px 0 0}

  .tabs{display:flex;gap:4px;border-bottom:1px solid #ece5de;margin-bottom:18px}
  .tab{border:none;background:none;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--coral)}
  .abar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .arow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
  .athumb{width:52px;height:52px;border-radius:8px;background:#f0ebe7;overflow:hidden;flex-shrink:0}
  .aname{font-size:15px;font-weight:500;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ameta{font-size:13px;color:var(--muted);margin:0}
  .icon{border:none;background:none;padding:8px;border-radius:7px;cursor:pointer;color:#6b625a;font-size:15px}

  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .flabel{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 6px}
  .imgtray{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .islot{position:relative;width:70px;height:90px;border-radius:8px;overflow:hidden;border:1px solid var(--line2)}
  .islot img{width:100%;height:100%;object-fit:cover}
  .iremove{position:absolute;top:3px;right:3px;background:rgba(74,74,74,.8);color:#fff;border:none;border-radius:5px;width:20px;height:20px;cursor:pointer}
  .iadd{width:70px;height:90px;border-radius:8px;border:1.5px dashed #d8cfc6;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--muted);font-size:11px}
  .sizepick{border:1px solid var(--line2);border-radius:7px;padding:7px 13px;font-size:13px;cursor:pointer;background:#fff;color:#514840}
  .sizepick.on{background:var(--coral);color:#fff;border-color:var(--coral)}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;color:#514840;margin-top:16px;cursor:pointer}
  .factions{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:20px}
  .card-pad{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px}

  footer{text-align:center;padding:26px 20px;font-size:13px;color:#b0aaa4;border-top:1px solid #ece5de}
  footer img{height:40px;opacity:.85;margin:0 auto 8px}

const sb = (SUPABASE_URL.startsWith("http"))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const SIZES = ["PP","P","M","G","GG","36","38","40","42","44","46"];

let state = { products:[], clientes:null, view:"shop", isAdmin:false, q:"", cat:"Todas", selected:null, editing:null, tab:"products", loading:true };
const app = document.getElementById("app");

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------- Dados (Supabase) ------------------------------------- */
async function loadProducts(){
  if(!sb){ state.products=[]; state.loading=false; return; }
  const { data, error } = await sb.from("produtos").select("*").order("criado_em",{ascending:false});
  if(error){ console.error(error); toast("Erro ao carregar produtos"); }
  state.products = (data||[]).map(r=>({
    id:r.id, name:r.nome, ref:r.ref, price:r.preco, category:r.categoria,
    description:r.descricao, sizes:r.tamanhos||[], colors:r.cores||[],
    images:r.imagens||[], featured:r.destaque, stock:r.estoque
  }));
  state.loading=false;
}
function toRow(p){
  return { nome:p.name, ref:p.ref, preco:Number(p.price)||0, categoria:p.category,
    descricao:p.description, tamanhos:p.sizes||[], cores:p.colors||[],
    imagens:p.images||[], destaque:!!p.featured, estoque:p.stock||"disponivel" };
}
async function saveProduct(p){
  if(!sb) return toast("Configure o Supabase primeiro");
  const row=toRow(p);
  let res;
  if(p.id) res=await sb.from("produtos").update(row).eq("id",p.id);
  else     res=await sb.from("produtos").insert(row);
  if(res.error){ console.error(res.error); return toast("Erro ao salvar"); }
  await loadProducts(); toast("Peça salva!");
}
async function deleteProduct(id){
  if(!confirm("Excluir esta peça?")) return;
  const { error }=await sb.from("produtos").delete().eq("id",id);
  if(error){ toast("Erro ao excluir"); return; }
  await loadProducts(); render(); toast("Peça excluída");
}
async function uploadImage(file){
  const name=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+(file.name.split(".").pop()||"jpg");
  const { error }=await sb.storage.from("fotos").upload(name,file,{cacheControl:"3600",upsert:false});
  if(error){ console.error(error); toast("Erro no upload"); return null; }
  const { data }=sb.storage.from("fotos").getPublicUrl(name);
  return data.publicUrl;
}
async function saveCliente(c){
  if(!sb) return { ok:false };
  const { error }=await sb.from("clientes").insert(c);
  if(error){ console.error(error); return { ok:false, error }; }
  return { ok:true };
}
async function loadClientes(){
  if(!sb) return [];
  const { data, error }=await sb.from("clientes").select("*").order("criado_em",{ascending:false});
  if(error){ console.error(error); toast("Erro ao carregar clientes"); return []; }
  return data||[];
}
function exportCSV(rows){
  const cols=["criado_em","nome","email","telefone","nascimento","busca","cidade","bairro","endereco"];
  const head=["Data","Nome","E-mail","Telefone","Nascimento","Busca","Cidade","Bairro","Endereço"];
  const cell=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const lines=[head.join(",")];
  rows.forEach(r=>lines.push(cols.map(c=>{
    if(c==="criado_em"&&r[c]) return cell(new Date(r[c]).toLocaleString("pt-BR"));
    if(c==="nascimento"&&r[c]) return cell(new Date(r[c]+"T00:00:00").toLocaleDateString("pt-BR"));
    return cell(r[c]);
  }).join(",")));
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="clientes-liss.csv"; a.click();
  URL.revokeObjectURL(url);
}

/* ---------- Render principal ------------------------------------- */
function render(){
  if(state.loading){ app.innerHTML=`<div style="min-height:60vh;display:flex;align-items:center;justify-content:center"><img src="${LOGO}" style="height:70px;opacity:.5"></div>`; return; }
  let html = header();
  if(state.view==="shop") html+=shop();
  else if(state.view==="admin") html+= state.isAdmin ? admin() : login();
  html+=footer();
  app.innerHTML=html;
  bind();
  if(state.selected) openModal(state.selected);
  if(state.editing!=null) openForm();
}

function header(){
  const right = state.isAdmin
    ? `${state.view!=="admin"?'<button class="nav-btn" data-go="admin">Painel</button>':'<button class="nav-btn" data-go="shop">Ver vitrine</button>'}
       <button class="nav-ghost" data-logout>Sair</button>`
    : `<button class="nav-ghost" data-go="admin">🔒 Painel</button>`;
  return `<header><div class="head-in">
     <button class="brand" data-go="shop"><img src="${LOGO}" alt="Liss"><span class="sub">por ${esc(CONFIG.seller)}</span></button>
     <div style="display:flex;gap:6px">${right}</div>
   </div><div class="rule"></div></header>`;
}
function footer(){
  return `<footer><img src="${LOGO}" alt="Liss"><p style="margin:0">Revenda oficial · Fale com ${esc(CONFIG.seller)} pelo WhatsApp</p></footer>`;
}

/* ---------- Vitrine ---------------------------------------------- */
function shop(){
  const cats=["Todas",...CONFIG.categories];
  const featured=state.products.find(p=>p.featured);
  let list=state.products
    .filter(p=>state.cat==="Todas"||p.category===state.cat)
    .filter(p=>{ if(!state.q.trim())return true; const t=(p.name+" "+(p.ref||"")+" "+(p.category||"")).toLowerCase(); return t.includes(state.q.toLowerCase()); });

  let h=`<main>`;
  h+=`<div class="cupom-cta">
      <div class="cupom-txt">
        <p class="cupom-title">🎟️ Ganhe cupons de desconto</p>
        <p class="cupom-sub">Cadastre-se e receba as promoções da Liss em primeira mão.</p>
      </div>
      <button class="cupom-btn" id="open-cupom">Quero receber cupons</button>
    </div>`;
  if(featured && state.cat==="Todas" && !state.q){
    const img=(featured.images||[])[0];
    h+=`<div class="featured" data-open="${featured.id}">
      <div class="fimg">${img?`<img src="${img}">`:"🖼️"}</div>
      <div class="fbody">
        <span class="ftag">★ Destaque da semana</span>
        <h2 class="ftitle">${esc(featured.name)}</h2>
        ${featured.ref?`<p class="fref">Ref: ${esc(featured.ref)}</p>`:""}
        <p class="fprice">${brl(featured.price)}</p>
        <span class="fcta">Ver detalhes</span>
      </div></div>`;
  }
  h+=`<div class="controls">
      <div class="search">🔍<input id="q" placeholder="Buscar por nome ou referência…" value="${esc(state.q)}"></div>
      <div class="chips">${cats.map(c=>`<button class="chip ${state.cat===c?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    </div>`;

  if(list.length===0){
    h+=`<div class="empty">📦<p class="t">${state.products.length?"Nenhuma peça encontrada":"Vitrine ainda vazia"}</p>
        <p>${state.products.length?"Tente outra busca ou categoria.":"Entre no painel para cadastrar as peças."}</p></div>`;
  } else {
    h+=`<div class="grid">${list.map(card).join("")}</div>`;
  }
  return h+`</main>`;
}
function card(p){
  const img=(p.images||[])[0];
  return `<button class="card" data-open="${p.id}">
    <div class="cimg">${img?`<img src="${img}">`:"🖼️"}
      ${p.featured?'<span class="badge">★ Destaque</span>':""}
      ${p.stock==="esgotado"?'<span class="badge-out">Esgotado</span>':""}
    </div>
    <div class="cbody">
      <p class="cname">${esc(p.name)}</p>
      ${p.ref?`<p class="cref">Ref: ${esc(p.ref)}</p>`:""}
      <p class="cprice">${brl(p.price)}</p>
    </div></button>`;
}

/* ---------- Modal do produto ------------------------------------- */
let modalIdx=0;
function openModal(p){
  modalIdx=0;
  const imgs=(p.images&&p.images.length)?p.images:[""];
  const draw=()=>{
    const img=imgs[modalIdx];
    const wa=`https://wa.me/${CONFIG.whatsapp}?text=`+encodeURIComponent(
      `Olá ${CONFIG.seller}! Vi na vitrine da Liss e tenho interesse:\n\n*${p.name}*`+
      (p.ref?`\nRef: ${p.ref}`:"")+`\nPreço: ${brl(p.price)}\n\nEstá disponível?`);
    const ov=document.createElement("div"); ov.className="overlay";
    ov.innerHTML=`<div class="modal">
      <button class="mclose">✕</button>
      <div class="mgrid">
        <div class="mimgcol">
          <div class="mimg">${img?`<img src="${img}">`:"🖼️"}
            ${imgs.length>1?`<button class="arrow" style="left:8px" data-prev>‹</button><button class="arrow" style="right:8px" data-next>›</button>`:""}
          </div>
          ${imgs.length>1?`<div class="thumbs">${imgs.map((im,i)=>`<button class="thumb ${i===modalIdx?"on":""}" data-th="${i}">${im?`<img src="${im}">`:""}</button>`).join("")}</div>`:""}
        </div>
        <div class="minfo">
          ${p.category?`<span class="mcat">${esc(p.category)}</span>`:""}
          <h2 class="mtitle">${esc(p.name)}</h2>
          ${p.ref?`<p class="mref">Ref: ${esc(p.ref)}</p>`:""}
          <p class="mprice">${brl(p.price)}</p>
          ${p.description?`<p class="mdesc">${esc(p.description)}</p>`:""}
          ${p.sizes&&p.sizes.length?`<div style="margin-top:14px"><p class="mlabel">Tamanhos</p><div class="tags">${p.sizes.map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div></div>`:""}
          ${p.colors&&p.colors.length?`<div style="margin-top:14px"><p class="mlabel">Cores</p><div class="tags">${p.colors.map(c=>`<span class="tag">${esc(c)}</span>`).join("")}</div></div>`:""}
          ${p.stock==="esgotado"
            ?`<div class="out">Esta peça está esgotada no momento.</div>`
            :`<a class="wa" href="${wa}" target="_blank" rel="noreferrer">💬 Tenho interesse</a>`}
          <p class="mhint">Abre o WhatsApp de ${esc(CONFIG.seller)} já com os dados da peça.</p>
        </div>
      </div></div>`;
    const close=()=>{ ov.remove(); state.selected=null; };
    ov.addEventListener("click",e=>{ if(e.target===ov) close(); });
    ov.querySelector(".mclose").onclick=close;
    if(imgs.length>1){
      ov.querySelector("[data-prev]").onclick=()=>{ modalIdx=(modalIdx-1+imgs.length)%imgs.length; ov.remove(); draw(); };
      ov.querySelector("[data-next]").onclick=()=>{ modalIdx=(modalIdx+1)%imgs.length; ov.remove(); draw(); };
      ov.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{ modalIdx=+b.dataset.th; ov.remove(); draw(); });
    }
    document.body.appendChild(ov);
  };
  draw();
}

      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:32px">🎟️</div>
        <h2 style="font-size:20px;font-weight:600;margin:6px 0 2px">Receber cupons de desconto</h2>
        <p style="font-size:13px;color:var(--muted);margin:0">Preencha para participar das campanhas da Liss.</p>
      </div>
      <div class="fgrid">
        <div style="grid-column:span 2"><p class="flabel">Nome completo *</p><input class="input" id="c_nome"></div>
        <div><p class="flabel">E-mail</p><input class="input" id="c_email" type="email" placeholder="voce@email.com"></div>
        <div><p class="flabel">Telefone *</p><input class="input" id="c_tel" inputmode="tel" placeholder="(81) 9....."></div>
        <div><p class="flabel">Data de nascimento</p><input class="input" id="c_nasc" type="date"></div>
        <div style="grid-column:span 2"><p class="flabel">Que tipo de peça você busca?</p><select class="input" id="c_busca">${opts.map(o=>`<option>${esc(o)}</option>`).join("")}</select></div>
        <div><p class="flabel">Cidade</p><input class="input" id="c_cidade" value="Recife"></div>
        <div><p class="flabel">Bairro</p><input class="input" id="c_bairro"></div>
        <div style="grid-column:span 2"><p class="flabel">Endereço</p><input class="input" id="c_end" placeholder="Rua, número, complemento"></div>
      </div>
      <p class="err" id="c_err" style="display:none"></p>
      <button class="pbtn" id="c_save" style="margin-top:6px">Quero meus cupons</button>
      <p class="mhint">* Nome e telefone são obrigatórios. Seus dados são usados só para enviar as promoções da Liss.</p>
    </div></div>`;
  const close=()=>ov.remove();
  ov.addEventListener("click",e=>{ if(e.target===ov) close(); });
  ov.querySelector(".mclose").onclick=close;
  ov.querySelector("#c_save").onclick=async()=>{
    const err=ov.querySelector("#c_err");
    const nome=ov.querySelector("#c_nome").value.trim();
    const tel=ov.querySelector("#c_tel").value.trim();
    if(!nome){ err.textContent="Por favor, informe seu nome."; err.style.display="block"; return; }
    if(!tel){ err.textContent="Por favor, informe seu telefone."; err.style.display="block"; return; }
    err.style.display="none";
    const btn=ov.querySelector("#c_save"); btn.disabled=true; btn.textContent="Enviando…";
    const res=await saveCliente({
      nome, telefone:tel,
      email:ov.querySelector("#c_email").value.trim(),
      nascimento:ov.querySelector("#c_nasc").value||null,
      busca:ov.querySelector("#c_busca").value,
      cidade:ov.querySelector("#c_cidade").value.trim(),
      bairro:ov.querySelector("#c_bairro").value.trim(),
      endereco:ov.querySelector("#c_end").value.trim()
    });
    if(res.ok){
      ov.querySelector(".modal").innerHTML=`<button class="mclose">✕</button>
        <div style="padding:34px 28px" class="ok-box">
          <div class="ok-emoji">🎉</div>
          <h2 style="font-size:21px;font-weight:600;margin:0 0 6px">Cadastro concluído!</h2>
          <p style="color:#6b625a;font-size:14px;line-height:1.6;margin:0">Prontinho, ${esc(nome.split(" ")[0])}! Você vai receber os cupons e novidades da Liss assim que houver campanha. 💛</p>
          <button class="pbtn auto" style="margin:18px auto 0">Fechar</button>
        </div>`;
      ov.querySelectorAll(".mclose,.pbtn").forEach(b=>b.onclick=close);
    } else {
      btn.disabled=false; btn.textContent="Quero meus cupons";
      err.textContent="Não deu para enviar agora. Tente de novo em instantes."; err.style.display="block";
    }
  };
  document.body.appendChild(ov);
}

function login(){

    <img src="${LOGO}" alt="Liss">

/* ---------- Painel ----------------------------------------------- */
function admin(){
  let h=`<main>
    <div class="tabs">
      <button class="tab ${state.tab==="products"?"on":""}" data-tab="products">Peças (${state.products.length})</button>
      <button class="tab ${state.tab==="clientes"?"on":""}" data-tab="clientes">Clientes${state.clientes?` (${state.clientes.length})`:""}</button>
      <button class="tab ${state.tab==="settings"?"on":""}" data-tab="settings">Ajuda</button>
    </div>`;
  if(state.tab==="products"){
    h+=`<div class="abar"><p style="font-size:14px;color:var(--muted);margin:0">Gerencie as peças da vitrine.</p>
        <button class="pbtn auto" id="new">＋ Nova peça</button></div>`;
    if(state.products.length===0){
      h+=`<div class="empty">📦<p class="t">Nenhuma peça ainda</p><p>Clique em “Nova peça” para começar.</p></div>`;
    } else {
      h+=state.products.map(p=>{
        const img=(p.images||[])[0];
        return `<div class="arow">
          <div class="athumb">${img?`<img src="${img}" style="width:100%;height:100%;object-fit:cover">`:""}</div>
          <div style="flex:1;min-width:0">
            <p class="aname">${esc(p.name)||"Sem nome"} ${p.featured?"★":""}</p>
            <p class="ameta">${esc(p.category||"")} · ${brl(p.price)}${p.ref?" · Ref "+esc(p.ref):""}${p.stock==="esgotado"?" · Esgotado":""}</p>
          </div>
          <div style="display:flex;gap:2px;flex-shrink:0">
            <button class="icon" data-dup="${p.id}" title="Duplicar">⧉</button>
            <button class="icon" data-edit="${p.id}" title="Editar">✎</button>
            <button class="icon" data-del="${p.id}" title="Excluir" style="color:var(--coral-dark)">🗑</button>
          </div></div>`;
      }).join("");
    }
  } else if(state.tab==="clientes"){
    if(!state.clientes){
      h+=`<div class="empty">⏳<p class="t">Carregando cadastros…</p></div>`;
    } else if(state.clientes.length===0){
      h+=`<div class="empty">📇<p class="t">Nenhum cadastro ainda</p><p>Quando clientes se cadastrarem para cupons, aparecem aqui.</p></div>`;
    } else {
      h+=`<div class="abar"><p style="font-size:14px;color:var(--muted);margin:0">${state.clientes.length} cliente(s) cadastrado(s) para cupons.</p>
          <button class="pbtn auto" id="csv">⬇ Baixar CSV</button></div>`;
      h+=state.clientes.map(c=>`<div class="arow">
          <div style="flex:1;min-width:0">
            <p class="aname">${esc(c.nome)}</p>
            <p class="ameta">${esc(c.telefone||"")}${c.email?" · "+esc(c.email):""}${c.busca?" · busca: "+esc(c.busca):""}</p>
            <p class="ameta">${[c.bairro,c.cidade].filter(Boolean).map(esc).join(", ")}${c.endereco?" · "+esc(c.endereco):""}${c.nascimento?" · nasc: "+new Date(c.nascimento+"T00:00:00").toLocaleDateString("pt-BR"):""}</p>
          </div>
          <div style="flex-shrink:0;text-align:right">
            <a class="icon" href="https://wa.me/55${(c.telefone||"").replace(/\D/g,"")}" target="_blank" title="WhatsApp">💬</a>
            <p class="ameta" style="margin:4px 0 0">${c.criado_em?new Date(c.criado_em).toLocaleDateString("pt-BR"):""}</p>
          </div></div>`).join("");
    }
  } else {
    h+=`<div class="card-pad" style="font-size:14px;line-height:1.7;color:#514840">
      <p style="margin-top:0"><b>Como adicionar uma peça:</b> vá em “Peças” → “Nova peça”, preencha nome e preço, envie as fotos e salve. Ela aparece na hora na vitrine.</p>
      <p><b>Marcar destaque:</b> a peça marcada como destaque aparece no topo da vitrine.</p>
      <p><b>Esgotou?</b> edite a peça e mude o estoque para “Esgotado” — ela continua visível, mas sem o botão de WhatsApp.</p>
      <p><b>Cupons / clientes:</b> na aba “Clientes” ficam todos que se cadastraram pelo botão de cupons da vitrine. Use “Baixar CSV” para exportar a lista (abre no Excel) e disparar suas campanhas.</p>
      <p style="margin-bottom:0;color:var(--muted)">As configurações da loja (WhatsApp, PIN, nome) ficam no código do site, no bloco CONFIG. Para alterar, me chame que eu ajusto.</p>
    </div>`;
  }
  return h+`</main>`;
}

/* ---------- Formulário da peça ----------------------------------- */
function openForm(){
  const isNew = state.editing==="new";
  const p = isNew ? { name:"",ref:"",price:"",category:CONFIG.categories[0]||"",description:"",sizes:[],colors:[],images:[],featured:false,stock:"disponivel" }
                  : JSON.parse(JSON.stringify(state.editing));

  const ov=document.createElement("div"); ov.className="overlay";
  const drawImgs=()=>`${p.images.map((im,i)=>`<div class="islot"><img src="${im}"><button class="iremove" data-rm="${i}">✕</button></div>`).join("")}
    ${p.images.length<6?`<button class="iadd" id="addimg">＋<span>Adicionar</span></button>`:""}`;

  ov.innerHTML=`<div class="modal sm">
    <button class="mclose">✕</button>
    <div style="padding:24px 26px 26px">
      <h2 style="font-size:20px;font-weight:600;margin:0 0 18px">${isNew?"Nova peça":"Editar peça"}</h2>
      <p class="flabel">Fotos (até 6)</p>
      <div class="imgtray" id="tray">${drawImgs()}</div>
      <input type="file" id="file" accept="image/*" multiple style="display:none">
      <div class="fgrid">
        <div style="grid-column:span 2"><p class="flabel">Nome</p><input class="input" id="f_name" value="${esc(p.name)}" placeholder="Calça Reta Média"></div>
        <div><p class="flabel">Referência</p><input class="input" id="f_ref" value="${esc(p.ref||"")}" placeholder="1765194"></div>
        <div><p class="flabel">Preço (R$)</p><input class="input" id="f_price" value="${p.price}" placeholder="159.90" inputmode="decimal"></div>
        <div><p class="flabel">Categoria</p><select class="input" id="f_cat">${CONFIG.categories.map(c=>`<option ${c===p.category?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
        <div><p class="flabel">Estoque</p><select class="input" id="f_stock"><option value="disponivel" ${p.stock!=="esgotado"?"selected":""}>Disponível</option><option value="esgotado" ${p.stock==="esgotado"?"selected":""}>Esgotado</option></select></div>
        <div style="grid-column:span 2"><p class="flabel">Descrição</p><textarea class="input" id="f_desc" placeholder="Detalhes da peça, tecido, caimento…">${esc(p.description||"")}</textarea></div>
        <div style="grid-column:span 2"><p class="flabel">Cores (separadas por vírgula)</p><input class="input" id="f_colors" value="${esc((p.colors||[]).join(", "))}" placeholder="Preto, Azul claro, Bege"></div>
      </div>
      <p class="flabel">Tamanhos</p>
      <div class="tags" id="sizes">${SIZES.map(s=>`<button class="sizepick ${p.sizes.includes(s)?"on":""}" data-size="${s}">${s}</button>`).join("")}</div>
      <label class="check"><input type="checkbox" id="f_feat" ${p.featured?"checked":""}> Destacar no topo da vitrine</label>
      <p class="err" id="ferr" style="display:none"></p>
      <div class="factions"><button class="tbtn" id="cancel">Cancelar</button><button class="pbtn auto" id="save">✓ Salvar</button></div>
    </div></div>`;

  const close=()=>{ ov.remove(); state.editing=null; };
  ov.addEventListener("click",e=>{ if(e.target===ov) close(); });
  ov.querySelector(".mclose").onclick=close;
  ov.querySelector("#cancel").onclick=close;

  const rerenderTray=()=>{ ov.querySelector("#tray").innerHTML=drawImgs(); wireTray(); };
  const wireTray=()=>{
    const add=ov.querySelector("#addimg"); if(add) add.onclick=()=>ov.querySelector("#file").click();
    ov.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ p.images.splice(+b.dataset.rm,1); rerenderTray(); });
  };
  wireTray();
  ov.querySelector("#file").onchange=async e=>{
    const files=[...e.target.files].slice(0,6-p.images.length);
    for(const f of files){ toast("Enviando foto…"); const url=await uploadImage(f); if(url){ p.images.push(url); rerenderTray(); } }
  };
  ov.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{
    const s=b.dataset.size; const i=p.sizes.indexOf(s);
    if(i>=0)p.sizes.splice(i,1); else p.sizes.push(s); b.classList.toggle("on");
  });
  ov.querySelector("#save").onclick=async()=>{
    const err=ov.querySelector("#ferr");
    const name=ov.querySelector("#f_name").value.trim();
    const priceRaw=ov.querySelector("#f_price").value.replace(",",".");
    if(!name){ err.textContent="Dê um nome à peça."; err.style.display="block"; return; }
    if(priceRaw===""||isNaN(Number(priceRaw))){ err.textContent="Informe um preço válido."; err.style.display="block"; return; }
    const prod={
      id: isNew?undefined:state.editing.id, name, ref:ov.querySelector("#f_ref").value.trim(),
      price:Number(priceRaw), category:ov.querySelector("#f_cat").value,
      description:ov.querySelector("#f_desc").value, stock:ov.querySelector("#f_stock").value,
      colors:ov.querySelector("#f_colors").value.split(",").map(s=>s.trim()).filter(Boolean),
      sizes:p.sizes, images:p.images, featured:ov.querySelector("#f_feat").checked
    };
    await saveProduct(prod); close(); render();
  };
  document.body.appendChild(ov);
}

/* ---------- Eventos ---------------------------------------------- */
function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ state.view=b.dataset.go; state.selected=null; render(); });
  const lo=document.querySelector("[data-logout]"); if(lo) lo.onclick=()=>{ state.isAdmin=false; state.view="shop"; render(); };
  const q=document.getElementById("q"); if(q) q.oninput=e=>{ state.q=e.target.value; const g=document.querySelector(".grid")||document.querySelector(".empty"); softShop(); };
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ state.cat=b.dataset.cat; render(); });
  const oc=document.getElementById("open-cupom"); if(oc) oc.onclick=openCupom;
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ const p=state.products.find(x=>x.id===b.dataset.open); if(p){ state.selected=p; openModal(p);} });

  const enter=document.getElementById("enter");
  if(enter){
    const go=()=>{ const v=document.getElementById("pin").value; if(v===CONFIG.adminPin){ state.isAdmin=true; render(); } else document.getElementById("pinerr").style.display="block"; };
    enter.onclick=go;
    document.getElementById("pin").onkeydown=e=>{ if(e.key==="Enter")go(); };
  }
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=async()=>{
    state.tab=b.dataset.tab;
    if(state.tab==="clientes"){ state.clientes=null; render(); state.clientes=await loadClientes(); render(); }
    else render();
  });
  const csv=document.getElementById("csv"); if(csv) csv.onclick=()=>{ if(state.clientes&&state.clientes.length) exportCSV(state.clientes); };
  const nw=document.getElementById("new"); if(nw) nw.onclick=()=>{ state.editing="new"; openForm(); };
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ state.editing=state.products.find(x=>x.id===b.dataset.edit); openForm(); });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteProduct(b.dataset.del));
  document.querySelectorAll("[data-dup]").forEach(b=>b.onclick=async()=>{
    const p=state.products.find(x=>x.id===b.dataset.dup);
    await saveProduct({...p,id:undefined,name:p.name+" (cópia)",featured:false}); render();
  });
}
function softShop(){
  const main=document.querySelector("main"); if(!main) return;
  const cats=["Todas",...CONFIG.categories];
  const featured=state.products.find(p=>p.featured);
  let list=state.products.filter(p=>state.cat==="Todas"||p.category===state.cat)
    .filter(p=>{ if(!state.q.trim())return true; const t=(p.name+" "+(p.ref||"")+" "+(p.category||"")).toLowerCase(); return t.includes(state.q.toLowerCase()); });
  const gridWrap=main.querySelector(".grid")||main.querySelector(".empty");
  if(gridWrap){
    const html = list.length? `<div class="grid">${list.map(card).join("")}</div>`
      : `<div class="empty">📦<p class="t">Nenhuma peça encontrada</p><p>Tente outra busca ou categoria.</p></div>`;
    gridWrap.outerHTML=html;
    document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ const p=state.products.find(x=>x.id===b.dataset.open); if(p){ state.selected=p; openModal(p);} });
  }
}
